<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number of vowels</title>
</head>
<body>
    <script>

        let str ="shalukushwaha";
        let count = 0;
        for(let ch of str.toLowerCase()){
            if("aeiou".includes(ch)){
                count++;
            }
        }
        console.log("Vowels = ",count);
        
    </script>
</body>
</html>
