<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest 3 Number</title>
</head>
<body>
    <script>

        let a=10,b=25,c=15;

        if(a>=b && a>=c){
            console.log(a+ "is largest");
        }
        else if(b>=a && b>=c){
            console.log(b+ " is largest");
        }
        else{
            console.log(c + " is largest");
        }
    </script>
</body>
</html>
