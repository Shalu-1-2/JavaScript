<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         let obj = {
            name:"shalu",
            age:20,
            gender:"Male",

            skills:{
                html:"InterMediate",
                css:"InterMediate",
                js:"Beginner"
            }
         }

         console.log(obj);

         obj.city= "jhansi"; //insert
         obj.name = "shalu kushwaha"; //update

        console.log(obj?.name);
        console.log(obj['name']);
        console.log(obj?.city);
        console.log(obj?.skills?.html);
        console.log(obj);
        console.log(Object.keys(obj));// keys  ko dekhne ke liye use krte hai 
        console.log(Object.values(obj));// valuse ko dekhne ke liye use krte hai 
        console.log(Object.entries(obj)); // object ko array ke form me pura show krta hai 

         let obj1 = {
            city:"Lucknow",
         }

         console.log(Object.assign({},obj,obj1)); //assign function kisi object ke ander new key value insert krta hai 
         

         let obj2 = {
            name:"nikhil", 
            age:21,
            gender:"Male"
         }

           

         let {name,age,gender} = obj2
         console.log(name);
         console.log(age);
         console.log(gender);
         
    </script>
</body>
</html>
