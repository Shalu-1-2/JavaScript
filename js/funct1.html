    <script>
        // higher order function
        
        function order(cart, payment) {
            console.log("order completed! wainting for payment", cart);
            payment()
            console.log("Done");
        }

        function payment() {
            console.log("payment Done");
        }

        order("pen", payment)

        //recursive  function


        function demo(n) {
            if (n == 0) {
                return 0
            }
            return n + demo(n - 1)

        }
        console.log(demo(5));

    </script>
