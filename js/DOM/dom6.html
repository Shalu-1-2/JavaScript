<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #bigImage {
      height: 400px;
      width: 400px;
      border: 1px solid;
    }

    .img>img {
      height: 100%;
      width: 100%;
      object-fit: contain;
    }

    .thumnail{
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .thumnail>img {
      height: 60px;
      width: 60px;
    }
  </style>
</head>

<body>
  <div class="img">
    <img src="images/17.png" alt="img1" id="bigImage">
    <div class="thumnail">

    </div>
  </div>
  <script>
    let images = [
      'images/18.png',
      'images/19.png',
      'images/20.png'
    ]

    let bigImage = document.getElementById('bigImage')
    bigImage.setAttribute("src", images[0])

    let t = document.querySelector('.thumnail')

    images.forEach((image) => {

      let img = document.createElement('img')
      img.setAttribute('src', image);

      img.onclick=()=>{
        bigImage.setAttribute('src',image)
      }

      img.onmouseenter=()=>{
        bigImage.setAttribute('scr',image)
      }
      t.appendChild(img)
      
    })

    
  </script>
</body>

</html>
