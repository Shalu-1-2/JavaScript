<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery Slider</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .gallery {
            width: 1130px;
            margin: 50px auto;
            position: relative;
            background-color: bisque;
            padding: 20px;
            overflow: hidden;
        }

        .gallery-container {
            display: flex;
            gap: 20px;
            transition: transform 0.4s ease;
        }

        .gallery-container img {
            height: 350px;
            width: 350px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;
            font-size: 22px;

            z-index: 10;
        }

        .prev {
            left: 5px;
        }

        .next {
            right: 5px;
        }
    </style>
</head>

<body>

    <div class="gallery">

        <div class="gallery-container" id="gallery">
        </div>

        <button class="prev" onclick="prev()">❮</button>

        <button class="next" onclick="next()">❯</button>

    </div>


    <script>

        let images = [
            "images/img1.jpg",
            "images/img2.jpg",
            "images/img3.jpg",
            "images/img4.jpg",
            "images/img1.jpg",
            "images/img2.jpg",
            "images/img3.jpg",
            "images/img4.jpg"
        ];


        let gallery = document.getElementById("gallery");


        // Images create karna
        for (let i = 0; i < images.length; i++) {

            let img = document.createElement("img");

            img.src = images[i];

            gallery.appendChild(img);
        }


        let start = 0;

        function next() {

            if (start < images.length - 3) {

                start++;

                gallery.style.transform =
                    `translateX(-${start * 370}px)`;
            }
        }

        function prev() {

            if (start > 0) {

                start--;

                gallery.style.transform =
                    `translateX(-${start * 370}px)`;
            }
        }

    </script>

</body>

</html>
