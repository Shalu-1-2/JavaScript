<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #product{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 30px;
        max-width: 1000px;
        margin: auto;
    }

    .card {
        width: 100%;
        min-height: 330px;
        padding: 15px;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        transition: 0.3s;
        box-sizing: border-box;
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
    }

    .product-image {
        height: 200px;
        width: 100%;
        object-fit: contain;
        border-radius: 8px;
        background-color: #f5f5f5;
    }

    .card h1 {
        font-size: 20px;
        margin: 12px 0 6px;
        color: #222;
        text-align: left;
    }

    .card p {
        font-size: 14px;
        color: #666;
        margin: 5px 0;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 12px;
        border: none;
        border-radius: 6px;
        background-color: #2563eb;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #1d4ed8;
    }
</style>
</head>
<body>
    
    <div id="product">
        

    </div>
    <script src="app.js"></script>
</body>
</html>
