<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height: 200px;
            width: 200px;
            border: 1px solid;
        }
        #btn{
             height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>choose color</h1>

    <div id="box"></div>
    <br><br>
    <div id="btn"></div>

    <script>
        let color =[
            "red","yellow","green","pink"
        ]

        color.forEach((item)=>{
            let btn = document.createElement('button')
            let box = document.getElementById('box')
            let btnContainer = document.getElementById('btn')

            btn.innerText = item;
            btn.onclick=()=>{
                box.style.backgroundColor = item;
            }
            btnContainer.appendChild(btn)
        })
    </script>
</body>
</html>
