<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
    <h1 id="a"> Hello Coders</h1>
 <p class="b">

 </p>

 <p id="c">

 </p>

    <script>

        console.log(a.innerText);

        console.log(b.innerText);   // innerText document ke visible data ko hi get or set krta hai
