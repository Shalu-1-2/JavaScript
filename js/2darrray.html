 <script>
       let arr = [
    [10,20,30],
    [40,90,60],

    let large = arr[0][0];

    let i,j;

        for(j=0; j<3;j++){

            if(arr[i][j]>large){
                large = arr[i][j];
            }
        }
    }  

    console.log(large);
 </script>
