<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap year</title>
</head>
<body>
    <script>
      let year =Number(prompt("Enter the year of :"));

      if(year%4==0){
        console.log("this is leap year :",year);
      }else{
        console.log("this is not leap year :",year);
      }

    </script>
</body>
</html>
