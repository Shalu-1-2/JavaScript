<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>factorial</title>
</head>
<body>
    <script>
          let num =Number(prompt("Enter your number :"));
          let fact =1;

          for(let i=1; i<=num; i++){
              fact *= i;
          }
          console.log(fact);
    </script>
</body>
</html>
