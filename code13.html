<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array of employees (name and salary), calculate the final salary after applying bonus according to salary slabs. </title>
</head>
<body>
    <script>
        let employees = [
    { name: "Shalu", salary: 18000 },
    { name: "Rahul", salary: 35000 },
    { name: "Aman", salary: 70000 }
];

for (let i = 0; i < employees.length; i++) {

    let salary = employees[i].salary;
    let bonus = 0;

    if (salary < 20000) {
        bonus = salary * 0.20;
    }
    else if (salary <= 50000) {
        bonus = salary * 0.10;
    }
    else {
        bonus = salary * 0.05;
    }

    let finalSalary = salary + bonus;

    console.log(
        employees[i].name +
        " Final Salary = " + finalSalary
    );
}
    </script>
</body>
</html>
